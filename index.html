<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NR Store — আপনার পছন্দের অ্যাপের ঠিকানা</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== উপরের অ্যাপ বার ===== -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">NR</span>
      <span class="brand-name">NR Store</span>
    </div>
    <button class="icon-btn" aria-label="নোটিফিকেশন">🔔</button>
  </div>

  <!-- ===== সার্চ বক্স ===== -->
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="অ্যাপ, গেম খুঁজুন...">
  </div>
</header>

<main id="mainContent">
  <!-- পরের ধাপে এখানে ফিচার্ড ব্যানার, ক্যাটাগরি, অ্যাপ গ্রিড যোগ হবে -->
  <p style="text-align:center; padding: 40px; color:#888;">পরের ধাপে বাকি অংশ যোগ হবে...</p>
</main>

<script src="script.js"></script>
</body>
</html>
